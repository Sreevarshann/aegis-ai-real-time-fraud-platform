[project]
name = "aegis"
version = "0.1.0"
description = "AEGIS AI - real-time financial intelligence, fraud detection and investigation platform (simulated data only)"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "alembic>=1.13",
    "redis>=5.0",
    "confluent-kafka>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "mlflow-skinny>=2.14",
    "langgraph>=0.2.50",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "prometheus-client>=0.20",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # pseudo-random generators are intentional: this is a seeded simulator, not crypto
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012",
    "N818",   # domain exception names (EventRejected, TransactionNotFound) read better without "Error"
    "SIM113",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["aegis"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires running PostgreSQL, Redis and Redpanda (make up / make test-integration)",
]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
