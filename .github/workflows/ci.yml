name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, types, unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest tests/unit -q

  integration:
    name: Integration tests (PostgreSQL, Redis, Redpanda, dbt)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: aegis, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: aegis_test }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      AEGIS_TEST_DATABASE_URL: postgresql+psycopg://aegis:ci-only-password@localhost:55432/aegis_test
      AEGIS_REQUIRE_INTEGRATION: "1"
      DBT_BIN: ${{ github.workspace }}/dbt-venv/bin/dbt
    steps:
      - uses: actions/checkout@v4
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 redpandadata/redpanda:v24.2.7 redpanda start \
            --mode dev-container --smp 1 --memory 768M --overprovisioned \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://localhost:9092,external://localhost:19092
          for i in $(seq 1 30); do docker exec redpanda rpk cluster health | grep -qE 'Healthy:.+true' && exit 0; sleep 2; done
          docker logs redpanda; exit 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e "backend[dev]"
      - run: python -m venv dbt-venv && dbt-venv/bin/pip install -q -r dbt/requirements.txt
      - run: pytest tests/integration -q
        working-directory: backend

  frontend:
    name: Frontend lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  e2e:
    name: Docker build + end-to-end (Compose stack, smoke test, Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the non-production example configuration
        run: cp .env.example .env
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait for health checks
        run: |
          docker compose up -d
          STACK_TIMEOUT=600 ./scripts/wait-for-stack.sh
      - name: End-to-end smoke test (Kafka -> consumer -> PostgreSQL -> API -> investigation -> UI)
        run: |
          docker compose exec -T api python -m aegis.streaming.producer scenarios
          python3 scripts/smoke_test.py --base http://localhost:3000 --password 'AegisDemo!2026'
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Playwright browser tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:3000 npx playwright test e2e/dashboard.spec.ts
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan full git history
        run: docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --no-banner --redact -v
