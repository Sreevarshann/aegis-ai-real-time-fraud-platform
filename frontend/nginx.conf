server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve the API container through Docker's DNS so an API restart (new IP) never breaks the proxy.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Server-Sent Events: no buffering, long read timeout.
  location /api/v1/transactions/stream {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }
  location /health/ { proxy_pass $api_upstream; }
  location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
